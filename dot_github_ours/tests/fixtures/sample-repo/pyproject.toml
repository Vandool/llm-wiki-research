[project]
name = "sample-orders"
version = "0.3.0"
description = "Sample orders service used by the wiki-kit test-suite"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
