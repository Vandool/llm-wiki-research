# .gitlab/wiki-site/quartz.config.yaml — Wiki-Kit 1.0.0. Quartz v5 YAML config (verified against v5.0.0). build.sh resolves __PLACEHOLDERS__.
configuration:
  pageTitle: "__WIKI_PAGE_TITLE__"
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-US
  defaultDateType: modified
  baseUrl: "localhost:8080"
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - instructions.md
    - requests.md
    - ".manifest.json"
    - ".wiki-plan.json"
    - ".gitignore"
    - "log/**"
    - "**/.DS_Store"
  theme:
    fontOrigin: local
    cdnCaching: false
    typography: { header: Schibsted Grotesk, body: Source Sans Pro, code: IBM Plex Mono }
    colors:
      lightMode: { light: "#faf8f8", lightgray: "#e5e5e5", gray: "#b8b8b8", darkgray: "#4e4e4e", dark: "#2b2b2b", secondary: "#284b63", tertiary: "#84a59d", highlight: "rgba(143, 159, 169, 0.15)", textHighlight: "#fff23688" }
      darkMode:  { light: "#161618", lightgray: "#393639", gray: "#646464", darkgray: "#d4d4d4", dark: "#ebebec", secondary: "#7b97aa", tertiary: "#84a59d", highlight: "rgba(143, 159, 169, 0.15)", textHighlight: "#b3aa0288" }

plugins:
  - source: github:quartz-community/note-properties
    enabled: true
    order: 5
    options: { includeAll: false, includedProperties: [description, tags, owner, status, audience, last_verified_commit], excludedProperties: [], hidePropertiesView: false, delimiters: "---", language: yaml }
    layout: { position: beforeBody, priority: 15, display: all }
  - source: github:quartz-community/created-modified-date
    enabled: true
    order: 10
    options: { priority: [frontmatter, git] }
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    order: 20
    options: { theme: { light: github-light, dark: github-dark }, keepBackground: false }
  - source: github:quartz-community/spacer
    enabled: true
    order: 25
    layout: { position: left, priority: 25, display: mobile-only }
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    order: 30
    options: { enableInHtmlEmbed: false, enableCheckbox: true }
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout: { position: right, priority: 30 }
  - source: github:quartz-community/crawl-links
    enabled: true
    order: 60
    options: { markdownLinkResolution: relative, prettyLinks: true, openLinksInNewTab: false, externalLinkIcon: true, disableBrokenWikilinks: true }
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options: { enableSiteMap: true, enableRSS: false }
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    layout: { position: left, priority: 50 }
  - source: github:quartz-community/graph
    enabled: true
    layout: { position: right, priority: 10 }
  - source: github:quartz-community/search
    enabled: true
    layout: { position: left, priority: 20, group: toolbar, groupOptions: { grow: true } }
  - source: github:quartz-community/backlinks
    enabled: true
    layout: { position: right, priority: 50 }
  - source: github:quartz-community/article-title
    enabled: true
    layout: { position: beforeBody, priority: 10 }
  - source: github:quartz-community/content-meta
    enabled: true
    layout: { position: beforeBody, priority: 20 }
  - source: github:quartz-community/tag-list
    enabled: true
    layout: { position: beforeBody, priority: 30 }
  - source: github:quartz-community/page-title
    enabled: true
    layout: { position: left, priority: 10 }
  - source: github:quartz-community/darkmode
    enabled: true
    layout: { position: left, priority: 30, group: toolbar }
  - source: github:quartz-community/reader-mode
    enabled: true
    layout: { position: left, priority: 35, group: toolbar }
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout: { position: beforeBody, priority: 5, condition: not-index }
  - source: github:quartz-community/footer
    enabled: true
    options: { links: { Repository: "__WIKI_REPO_URL__", "Request a wiki change": "__WIKI_REQUESTS_URL__" } }
    layout: { position: footer, priority: 50 }

# Layout groups and per-page-type overrides (from quartz.config.default.yaml; `group: toolbar` above needs this).
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
